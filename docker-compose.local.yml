name: analog

services:
    postgres:
        image: postgres:18.1
        container_name: analog-db
        restart: unless-stopped
        environment:
            POSTGRES_USER: analog
            POSTGRES_PASSWORD: analog
            POSTGRES_DB: analog
        ports:
            - '127.0.0.1:5433:5432'
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U analog -d analog']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    pgdata:
