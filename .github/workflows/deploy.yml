name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: false

env:
    REGISTRY: ghcr.io
    VITE_API_URL: https://analog.coji-dev.com

jobs:
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .tool-versions
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
              env:
                  HUSKY: 0
            - run: pnpm check:ci
            - run: pnpm -r build

    build:
        needs: check
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        strategy:
            matrix:
                app: [api, web]
        steps:
            - uses: actions/checkout@v7
            - uses: docker/setup-buildx-action@v4
            - uses: docker/login-action@v4
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/analog-${{ matrix.app }}
                  tags: |
                      type=raw,value=latest
                      type=sha
            - uses: docker/build-push-action@v7
              with:
                  context: .
                  file: apps/${{ matrix.app }}/Dockerfile
                  platforms: linux/amd64
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: VITE_API_URL=${{ env.VITE_API_URL }}
                  cache-from: type=gha,scope=${{ matrix.app }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.app }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions: {}
        steps:
            - name: Set up SSH
              run: |
                  mkdir -p ~/.ssh && chmod 700 ~/.ssh
                  printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
                  cat > ~/.ssh/config <<EOF
                  Host vps
                    HostName ${{ secrets.VPS_HOST }}
                    Port ${{ secrets.VPS_PORT }}
                    User ${{ secrets.VPS_USER }}
                    IdentityFile ~/.ssh/id_ed25519
                    IdentitiesOnly yes
                  EOF
            - name: Deploy
              # The only thing the VPS accepts from this key is an image tag.
              # Must match the `type=sha` tag above (7-char short sha).
              run: ssh vps "sha-${GITHUB_SHA::7}"
