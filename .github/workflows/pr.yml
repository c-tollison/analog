name: PR Check

on:
    pull_request:
        types: [opened, synchronize, reopened]

jobs:
    check-and-build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v6
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .tool-versions
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
              env:
                  HUSKY: 0
            - run: pnpm check:ci
            - run: pnpm -r build
